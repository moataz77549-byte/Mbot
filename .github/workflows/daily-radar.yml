name: Daily AI Offer Radar
on:
  schedule:
    - cron: '0 18 * * *' # 21:00 Asia/Aden
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Telegram report to configured chat?'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ai-offer-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect from public sources
        env:
          MYMEMORY_CONTACT_EMAIL: ${{ secrets.MYMEMORY_CONTACT_EMAIL }}
        run: python -m collector.radar
      - name: Commit fresh report
        run: |
          git config user.name 'ai-offer-radar[bot]'
          git config user.email 'ai-offer-radar-bot@users.noreply.github.com'
          git add data/latest.json data/archive/
          if ! git diff --cached --quiet; then
            git commit -m "data: update AI offers $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Publish one digest per configured language
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AR_CHAT_ID: ${{ secrets.TELEGRAM_AR_CHAT_ID }}
          TELEGRAM_EN_BOT_TOKEN: ${{ secrets.TELEGRAM_EN_BOT_TOKEN }}
          TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}
        run: |
          python - <<'PY'
          import json,os
          from collector.radar import digest,post
          report=json.load(open('data/latest.json',encoding='utf-8'))
          token=os.getenv('TELEGRAM_BOT_TOKEN','')
          chat=os.getenv('TELEGRAM_AR_CHAT_ID','')
          if token and chat:
              post(token,chat,digest(report))
              if os.getenv('TELEGRAM_EN_CHAT_ID'):
                  post(os.getenv('TELEGRAM_EN_BOT_TOKEN') or token,os.environ['TELEGRAM_EN_CHAT_ID'],digest(report,'en'))
          else:print('No configured broadcast secrets: collected data only.')
          PY
